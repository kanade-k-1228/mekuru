[workspace]
resolver = "3"
members = ["pkgs/compiler"]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.89"
license = "MIT"

[workspace.dependencies]
mekuru-compiler = { path = "pkgs/compiler" }
anyhow = "1.0.102"
clap = { version = "4.5.53", features = ["derive"] }
env_logger = "0.11.8"
serde_json = "1.0.145"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2

[profile.release]
lto = "thin"
