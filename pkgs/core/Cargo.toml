[package]
name = "mekuru-compiler"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Native video compiler and preview server for Mekuru Movie Maker"

[dependencies]
roxmltree = "=0.21.2"
taffy = "=0.15.1"
tiny-skia = { version = "0.12.0", default-features = false, features = ["std", "simd"] }
cosmic-text = { version = "0.19.0", default-features = false, features = ["std", "fontconfig"] }
image = { version = "0.25.5", default-features = false, features = ["png", "jpeg", "webp"] }
rayon = "1.11.0"
serde_json = "1.0.145"
serde = { version = "1", features = ["derive", "rc"] }
sha2 = "0.11.1"
anyhow = "1.0.102"
clap = { version = "4.5.53", features = ["derive"] }
env_logger = "0.11.8"

axum = { version = "0.8.9", default-features = false, features = ["http1", "tokio", "ws"] }
tokio = { version = "1.54.1", features = ["rt-multi-thread", "net", "fs", "io-util", "sync", "time", "signal", "process", "macros"] }
tokio-util = { version = "0.7", features = ["io", "rt"] }
notify = "8.2.1"
mime_guess = "2.0"
percent-encoding = "2.3"

[target.'cfg(unix)'.dependencies]
libc = "0.2"
